name: score
# Hourly precomputation of spot scores into D1 (spot_scores). Runs here instead of a Worker cron because
# scoring all spots needs ~100 ms CPU, far above the Workers free plan's ~10 ms per invocation.
# Primary trigger: the Worker's Cloudflare cron (:07) fetches weather and then dispatches this workflow
# (workflow_dispatch; reasons in meta.score_dispatch_log). GitHub's own schedule is only the backup: it started
# 8 % of its runs over 72 h (docs/audit/monitor-72h.md), so one hourly slot is kept; it exits in ~20 s when the
# scores already use the newest weather. Field edits (pending_rescore) are scored by the next full run.
on:
  schedule:
    - cron: '23 * * * *'          # backup only (see above)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kuru çalıştırma: puan hesaplanır, D1''e yazılmaz'
        type: boolean
        default: false
      force:
        description: 'Puanlar en yeni havayla hesaplanmış olsa da yeniden puanla (deploy, veri yenileme)'
        type: boolean
        default: false
concurrency:
  group: score
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node_modules/.bin/esbuild scripts/score-job.ts --bundle --platform=node --format=esm --external:web-push --outfile=.score/job.mjs --log-level=warning
      - name: Weather grids and model spread → D1 (P2/P5; hourly, skipped when fresh)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node_modules/.bin/esbuild scripts/weather-grids.ts --bundle --platform=node --format=esm --outfile=.score/grids.mjs --log-level=warning
          node .score/grids.mjs ${{ inputs.force && '--force' || '' }}
      - name: Score spots → D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Q1: fresh weather first when the newest fetch is older than 60 min (POST /api/admin/weather/refresh)
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node .score/job.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}
      - name: Alert the owner on failure (E8)
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          node_modules/.bin/esbuild scripts/watchdog.ts --bundle --platform=node --format=esm --external:web-push --outfile=.score/watchdog.mjs --log-level=warning
          node .score/watchdog.mjs --failed
