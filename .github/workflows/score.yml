name: score
# Hourly precomputation of spot scores into D1 (spot_scores). Runs here instead of a Worker cron because
# scoring all spots needs ~100 ms CPU, far above the Workers free plan's ~10 ms per invocation.
# The Worker's :07 cron fetches weather; this runs after it.
on:
  schedule:
    - cron: '23 * * * *'          # full hourly run (v1 + v2)
    - cron: '8,38,53 * * * *'     # field edits: v2 with Monte Carlo only when pending_rescore has rows
  workflow_dispatch:
concurrency:
  group: score
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node_modules/.bin/esbuild scripts/score-job.ts --bundle --platform=node --format=esm --outfile=.score/job.mjs --log-level=warning
      - name: Score spots → D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .score/job.mjs ${{ github.event.schedule == '8,38,53 * * * *' && '--pending' || '' }}
