name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Which secrets are visible (names only, values never printed)
        env:
          S_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          S_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          S_ADMIN: ${{ secrets.ADMIN_TOKEN != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN set: $S_CF"
          echo "CLOUDFLARE_ACCOUNT_ID set: $S_ACC"
          echo "ADMIN_TOKEN set: $S_ADMIN"
          [ "$S_ADMIN" = true ] || echo "::warning::ADMIN_TOKEN repo secret is not visible to this workflow; admin API stays disabled (503)"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          packageManager: npm
          command: d1 migrations apply av-livn --remote
      - name: Build spot seed SQL
        run: node scripts/seed-spots.mjs seed.sql
      - name: Seed spots (keeps admin-edited field data)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          packageManager: npm
          command: d1 execute av-livn --remote --file ../../seed.sql
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          packageManager: npm
          command: deploy
      - name: Set ADMIN_TOKEN secret
        if: env.HAS_ADMIN_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          packageManager: npm
          secrets: ADMIN_TOKEN
          command: whoami
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      - name: Smoke test (av.livn.tr + livn.tr, www, /win untouched)
        run: bash scripts/smoke.sh
      - name: Admin API check (token from secrets, no writes)
        if: env.HAS_ADMIN_TOKEN == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: bash scripts/admin-smoke.sh
      - name: Re-score with the deployed spots and code
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run score.yml --ref main
