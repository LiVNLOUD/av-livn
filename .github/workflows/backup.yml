name: backup
# Daily encrypted backup of the owner-only D1 tables (field entries, photos, catch log, spots with admin
# edits, notification subscriptions). Plain text exists only in the runner's temp dir and is shredded after
# gpg (AES256, passphrase = BACKUP_PASSPHRASE secret). Artifacts of a public repo are downloadable by any
# signed-in GitHub user, so only the .gpg file is uploaded. Restore: docs/BACKUP.md.
on:
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Require the passphrase secret
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::BACKUP_PASSPHRASE secret missing (docs/BACKUP.md). No backup written."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './pipeline'
      - name: Dump → encrypt → shred
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y%m%dT%H%MZ)
          python -m av_pipeline.backup dump "$RUNNER_TEMP/d1.json"
          mkdir -p out
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            -o "out/av-livn-$stamp.json.gpg" "$RUNNER_TEMP/d1.json" 3<<<"$BACKUP_PASSPHRASE"
          shred -u "$RUNNER_TEMP/d1.json"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: av-livn-backup-${{ github.run_id }}
          path: out/*.json.gpg
          retention-days: 90
          if-no-files-found: error
