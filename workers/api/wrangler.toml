name = "av-livn"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
routes = [{ pattern = "av.livn.tr", custom_domain = true }]

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "av-livn"
database_id = "83445f2d-8c07-46ca-9a25-5fd9dc4d66b9"
migrations_dir = "migrations"

[triggers]
crons = ["7 * * * *", "9 * * * *", "11 * * * *", "13 * * * *"]

[observability]
enabled = true
